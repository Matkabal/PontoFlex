<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sem conexao</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        display: grid;
        place-items: center;
        background: linear-gradient(165deg, #f3f6f6, #d8eeeb);
        color: #153534;
      }
      .card {
        width: min(90vw, 420px);
        background: #ffffff;
        border: 1px solid #c8dddd;
        border-radius: 18px;
        padding: 28px;
        box-shadow: 0 15px 35px rgba(15, 118, 110, 0.12);
      }
      h1 {
        margin-top: 0;
        font-size: 1.25rem;
      }
      p {
        line-height: 1.5;
        margin-bottom: 0;
      }
    </style>
  </head>
  <body>
    <section class="card">
      <h1>Voce esta offline</h1>
      <p>O app continua funcionando com os dados locais. Conecte-se novamente para atualizar conteudo externo.</p>
    </section>
  </body>
</html>
